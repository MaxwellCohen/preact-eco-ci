name: deploy
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant from versions.json (blank = all)
        required: false
  push:
    branches: [main]
jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          if [ -n "${{ inputs.variant }}" ]; then echo 'list=["${{ inputs.variant }}"]' >> $GITHUB_OUTPUT
          else echo "list=$(jq -c 'keys' versions.json)" >> $GITHUB_OUTPUT; fi
  deploy:
    needs: variants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-variant.mjs ${{ matrix.variant }}
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: .build/${{ matrix.variant }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
